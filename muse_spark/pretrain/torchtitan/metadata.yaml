general:
  workload: muse-spark
  display_name: muse-spark-torchtitan
  workload_type: pretrain
  framework: torchtitan

container:
  images:
    # install_to_container.sh replaces its PyTorch with the pinned nightly.
    - url: 'nvcr.io#nvidia/pytorch:26.11-py3'
      name: 'muse-spark-torchtitan-base.sqsh'

repositories:
  # pytorch/torchtitan#6346 (stacked on #6352) with #6369 and #6371
  # cherry-picked on top.
  # TODO: pin upstream main once these PRs land.
  torchtitan:
    url: "https://github.com/elfiegg/torchtitan.git"
    commit: "03b8f376fd40e4720df82734185faab3c7a0f4f1"
  # Head of meta-pytorch/dist_moe#18, which adds the fused input-scaled
  # RMSNorm that #6371 uses.
  # TODO: pin upstream main once #18 lands.
  dist_moe:
    url: "https://github.com/elfiegg/DistMoE.git"
    commit: "bea783f9585afbe1aaf087650acf54465a918af6"
  remat:
    url: "https://github.com/meta-pytorch/remat.git"
    commit: "71905a6e60123a9adadd4d0cd5acae4e3cb8ba88"
  # Head of meta-pytorch/attention-gym#651, which adds the selective K/V
  # gather used in the sliding-window layers.
  # TODO: pin the merge commit once #651 lands.
  attention_gym:
    url: "https://github.com/meta-pytorch/attention-gym.git"
    commit: "d08fdce601ef0ea6c925e970442b3dda26e79752"

downloads:
  huggingface:
    repos:
      # Weights are randomly initialized; only the tokenizer is needed.
      - repo_id: meta-models/Muse-Spark-Open-816B-A42B
        repo_type: model
        revision: a604fa753b672b5dca3304d8648cf756120e29db
        name: Muse-Spark-Open-816B-A42B
        include:
          - chat_template.jinja
          - special_tokens_map.json
          - tokenizer.json
          - tokenizer_config.json

setup:
  venv_req: true
  dependencies:
    git:
      torchtitan:
        repo_key: torchtitan
        install_method:
          type: clone
      dist_moe:
        repo_key: dist_moe
        install_method:
          type: clone
      remat:
        repo_key: remat
        install_method:
          type: clone
      attention_gym:
        repo_key: attention_gym
        install_method:
          type: clone
  tasks:
    - name: container_setup
      cmd: './install_to_container.sh'
      job_type: srun
      requires_gpus: false

run:
  launcher_type: 'configured_sbatch'
  launch_script: 'launch.sh'

  gpu_configs:
    vr:
      model_configs:
        - model_size: '816b'
          dtypes:
            bf16:
              scales: [64]
              exact_scales: true
            fp8:
              scales: [64]
              exact_scales: true
