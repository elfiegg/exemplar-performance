general:
  workload: muse-spark
  display_name: muse-spark-torchtitan
  workload_type: pretrain
  framework: torchtitan

container:
  images:
    # install_to_container.sh replaces its PyTorch with the pinned nightly.
    - url: 'nvcr.io#nvidia/pytorch:26.11-py3'
      name: 'muse-spark-torchtitan-base.sqsh'

repositories:
  torchtitan:
    url: "https://github.com/elfiegg/torchtitan.git"
    commit: "76d3287d787587c87b28841b4ff4de77bb4ef625"
  dist_moe:
    url: "https://github.com/meta-pytorch/dist_moe.git"
    commit: "b76e0e042b4e97731fec981e974d375eb8eeed8b"
  remat:
    url: "https://github.com/meta-pytorch/remat.git"
    commit: "71905a6e60123a9adadd4d0cd5acae4e3cb8ba88"
  # attention-gym 755691f merged with meta-pytorch/attention-gym#651.
  # TODO: switch to meta-pytorch/attention-gym once #651 merges.
  attention_gym:
    url: "https://github.com/elfiegg/attention-gym.git"
    commit: "b4bb8a98e42d562a18fa1402bee5f775a63e7c74"

downloads:
  huggingface:
    repos:
      # Weights are randomly initialized; only the tokenizer is needed.
      - repo_id: meta-models/Muse-Spark-Open-816B-A42B
        repo_type: model
        revision: a604fa753b672b5dca3304d8648cf756120e29db
        name: Muse-Spark-Open-816B-A42B
        include:
          - chat_template.jinja
          - special_tokens_map.json
          - tokenizer.json
          - tokenizer_config.json

setup:
  venv_req: true
  dependencies:
    git:
      torchtitan:
        repo_key: torchtitan
        install_method:
          type: clone
      dist_moe:
        repo_key: dist_moe
        install_method:
          type: clone
      remat:
        repo_key: remat
        install_method:
          type: clone
      attention_gym:
        repo_key: attention_gym
        install_method:
          type: clone
  tasks:
    - name: container_setup
      cmd: './install_to_container.sh'
      job_type: srun
      requires_gpus: false

run:
  launcher_type: 'configured_sbatch'
  launch_script: 'launch.sh'

  gpu_configs:
    vr:
      model_configs:
        - model_size: '816b'
          dtypes:
            bf16:
              scales: [64]
              exact_scales: true
            fp8:
              scales: [64]
              exact_scales: true
